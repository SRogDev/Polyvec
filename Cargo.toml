[workspace]
resolver = "2"
members = [
    "crates/polyvec-core",
    "crates/polyvec-embeddings",
    "crates/polyvec-index",
    "crates/polyvec-ingestion",
    "crates/polyvec-retrieval",
    "crates/polyvec-storage",
    "crates/polyvec-server",
]
# The vendored markit tree is a plain path dependency (it declares its own
# empty [workspace] so it never joins this one); excluded here so Cargo does
# not treat it as a second workspace root.
exclude = ["vendor/markit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SRogDev/Polyvec"
homepage = "https://github.com/SRogDev/Polyvec"
authors = ["SRogDev"]

[workspace.dependencies]
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
log = "0.4.28"
hnsw_rs = "0.3.5"
redb = "4.4.0"
tantivy = { version = "0.26.2", default-features = false, features = ["mmap"] }
polyvec-core = { path = "crates/polyvec-core", version = "0.1.0" }
polyvec-embeddings = { path = "crates/polyvec-embeddings", version = "0.1.0" }
polyvec-index = { path = "crates/polyvec-index", version = "0.1.0" }
polyvec-ingestion = { path = "crates/polyvec-ingestion", version = "0.1.0" }
polyvec-retrieval = { path = "crates/polyvec-retrieval", version = "0.1.0" }
polyvec-storage = { path = "crates/polyvec-storage", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
