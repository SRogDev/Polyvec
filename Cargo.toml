[workspace]
resolver = "2"
members = ["crates/polyvec-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SRogDev/Polyvec"
homepage = "https://github.com/SRogDev/Polyvec"
authors = ["SRogDev"]

[workspace.dependencies]
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
