# cargo-deny configuration — Polyvec license & security policy.
#
# Dependency policy (see docs/decisions/ADR-003-dual-mit-apache-license.md):
#   * ONLY MIT and Apache-2.0 licensed dependencies are allowed.
#   * Copyleft licenses are denied (would conflict with dual MIT/Apache-2.0).
#
# Run:  cargo deny check        (needs cargo-deny installed; CI runs it)
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# NOTE: validated against cargo-deny 0.20.2 (2026-10-15) — all checks green.

[graph]
targets = []
all-features = false

[advisories]
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # RUSTSEC-2026-0258 (h2 0.3.27: unbounded empty DATA frames, low
    # severity). actix-http 3.19.0 pins h2 ^0.3, so the patched 0.4.16 is
    # not selectable. The vulnerable path is h2's HTTP/2 DATA-frame
    # handling; Polyvec Phase 3 serves plaintext HTTP/1.1 only (no TLS, and
    # actix-web negotiates HTTP/2 solely via ALPN under TLS), so it is
    # unreachable in this deployment shape. Re-evaluate when TLS/HTTP-2 is
    # added or actix-http moves to h2 0.4.
    "RUSTSEC-2026-0258",
]

[licenses]
# Explicit allow-list: the ONLY licenses accepted in this workspace.
# Anything not listed here is denied — including all copyleft licenses.
# (Dependency policy, see docs/decisions/ADR-003-dual-mit-apache-license.md.)
# NOTE: validated against cargo-deny 0.20.2 — the old `unlicensed`,
# `copyleft`, `allow-osi-fsf-free`, and `deny` keys were removed upstream;
# the allow-list below is the entire enforcement mechanism (anything not
# listed, including all copyleft licenses, is rejected).
allow = ["MIT", "Apache-2.0"]
confidence-threshold = 0.8
# Per-crate exceptions (the mechanism for anything outside the allow-list).
# Each one must be justifiable as: permissive, OSI-approved, non-copyleft.
exceptions = [
    # unicode-ident is a transitive dep of thiserror's proc-macro stack
    # (thiserror-impl → syn → quote → proc-macro2 → unicode-ident).
    # Unicode-3.0 covers its Unicode data tables; it is permissive,
    # OSI-approved, and non-copyleft. Unavoidable in any thiserror-based tree.
    { allow = ["Unicode-3.0"], crate = "unicode-ident" },
    # foldhash (Zlib) is a transitive dep of hnsw_rs via hashbrown
    # (hnsw_rs → hashbrown → foldhash). Zlib is a tiny OSI-approved
    # permissive license, GPL-compatible, non-copyleft. Unavoidable without
    # forking hnsw_rs; the Phase 1 license audit explicitly allows
    # explicitly-reviewed permissive licenses via documented exceptions
    # (coordinator decision 2026-10-15, reversible by Roger).
    { allow = ["Zlib"], crate = "foldhash" },
    # BSD-3-Clause stack pulled in by actix-web 4.17.0 (Phase 3). BSD-3-Clause
    # is OSI-approved, permissive, non-copyleft, and in the pre-approved
    # "BSD" category of the Phase 1 license audit (coordinator decision
    # 2026-10-15, reversible by Roger). Grouped by subtree; versions are the
    # Cargo.lock pins at the time of review (2026-10-15).
    # brotli compression stack (actix-http → brotli):
    { allow = ["BSD-3-Clause"], crate = "alloc-no-stdlib" },
    { allow = ["BSD-3-Clause"], crate = "alloc-stdlib" },
    { allow = ["BSD-3-Clause"], crate = "brotli" },
    { allow = ["BSD-3-Clause"], crate = "brotli-decompressor" },
    # zstd compression stack (actix-http → zstd):
    { allow = ["BSD-3-Clause"], crate = "zstd" },
    { allow = ["BSD-3-Clause"], crate = "zstd-safe" },
    { allow = ["BSD-3-Clause"], crate = "zstd-sys" },
    # charset handling (actix-web → encoding_rs):
    { allow = ["BSD-3-Clause"], crate = "encoding_rs" },
    # icu/zerovec unicode stack (actix-web → idna → icu_*): Unicode-3.0
    # covers the Unicode data tables, like the pre-existing unicode-ident
    # exception. Permissive, OSI-approved, non-copyleft.
    { allow = ["Unicode-3.0"], crate = "icu_collections" },
    { allow = ["Unicode-3.0"], crate = "icu_locale_core" },
    { allow = ["Unicode-3.0"], crate = "icu_normalizer" },
    { allow = ["Unicode-3.0"], crate = "icu_normalizer_data" },
    { allow = ["Unicode-3.0"], crate = "icu_properties" },
    { allow = ["Unicode-3.0"], crate = "icu_properties_data" },
    { allow = ["Unicode-3.0"], crate = "icu_provider" },
    { allow = ["Unicode-3.0"], crate = "litemap" },
    { allow = ["Unicode-3.0"], crate = "potential_utf" },
    { allow = ["Unicode-3.0"], crate = "tinystr" },
    { allow = ["Unicode-3.0"], crate = "writeable" },
    { allow = ["Unicode-3.0"], crate = "yoke" },
    { allow = ["Unicode-3.0"], crate = "yoke-derive" },
    { allow = ["Unicode-3.0"], crate = "zerofrom" },
    { allow = ["Unicode-3.0"], crate = "zerofrom-derive" },
    { allow = ["Unicode-3.0"], crate = "zerotrie" },
    { allow = ["Unicode-3.0"], crate = "zerovec" },
    { allow = ["Unicode-3.0"], crate = "zerovec-derive" },
]
include-dev = true

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "any"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
